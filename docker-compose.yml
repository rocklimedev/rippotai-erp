services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rippotai-erp-api-backend
    restart: always

    ports:
      - "5002:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200

    depends_on:
      - redis
      - elasticsearch

    networks:
      - rippotai-network

  redis:
    image: redis:7-alpine
    container_name: rippotai-erp-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - rippotai-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"

    networks:
      - rippotai-network

volumes:
  redis-data:
  elasticsearch-data:

networks:
  rippotai-network:
    driver: bridge