name: Backend route classification

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_call:

permissions:
  contents: read

jobs:
  route-classification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Test source route scanner
        run: npm run routes:test
      - name: Report and enforce explicit route classifications
        run: npm run routes:check
      - name: Verify existing permission catalogue
        run: node scripts/catalogue-routes.cjs --check
      - name: Run backend test suite
        run: npm test
      - name: Publish source-generated inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-route-inventory
          path: backend/artifacts/route-inventory.json
          if-no-files-found: warn
